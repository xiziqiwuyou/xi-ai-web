services:
  xi-ai-web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: xi-ai-web:local
    container_name: xi-ai-web
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    environment:
      NODE_ENV: production
      PORT: 8787
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before starting}
      UPSTREAM_BASE_URL: https://api.xi-ai.cn
      TRUST_PROXY_HOPS: 1
      KNOWLEDGE_ENABLED: "false"
      LANGFLOW_ENABLED: "false"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - xi-ai-web-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/ready').then((r)=>{if(!r.ok)process.exit(1);return r.json();}).then((j)=>process.exit(j.ready?0:1)).catch(()=>process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  xi-ai-web-data:
