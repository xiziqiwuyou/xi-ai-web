name: xi-ai-langflow

services:
  langflow:
    image: ${LANGFLOW_IMAGE:-langflowai/langflow:latest}
    container_name: xi-ai-langflow
    restart: unless-stopped
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: 7860
      LANGFLOW_AUTO_LOGIN: ${LANGFLOW_AUTO_LOGIN:-false}
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:?set LANGFLOW_SUPERUSER}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:?set LANGFLOW_SUPERUSER_PASSWORD}
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY:?set LANGFLOW_SECRET_KEY}
      LANGFLOW_CONFIG_DIR: /app/.langflow
    ports:
      - "127.0.0.1:${LANGFLOW_PORT:-7860}:7860"
    volumes:
      - langflow-data:/app/.langflow
    networks:
      - xi-ai

volumes:
  langflow-data:

networks:
  xi-ai:
    name: xi-ai
    external: true
