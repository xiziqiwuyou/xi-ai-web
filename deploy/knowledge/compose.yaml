name: xi-ai-web-knowledge

x-knowledge-environment: &knowledge-environment
  NODE_ENV: production
  PORT: 8787
  DATA_DIR: /app/data
  KNOWLEDGE_ENABLED: "true"
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
  DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
  KNOWLEDGE_ALLOW_INSECURE_DATABASE: ${KNOWLEDGE_ALLOW_INSECURE_DATABASE:-false}
  COS_SECRET_ID: ${COS_SECRET_ID:?set COS_SECRET_ID}
  COS_SECRET_KEY: ${COS_SECRET_KEY:?set COS_SECRET_KEY}
  COS_BUCKET: ${COS_BUCKET:?set COS_BUCKET}
  COS_REGION: ${COS_REGION:?set COS_REGION}
  COS_APP_ID: ${COS_APP_ID:?set COS_APP_ID}
  KNOWLEDGE_COS_UPLOAD_GRANT_TTL_SECONDS: ${KNOWLEDGE_COS_UPLOAD_GRANT_TTL_SECONDS:-900}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
  KNOWLEDGE_TOKEN_SECRET: ${KNOWLEDGE_TOKEN_SECRET:?set KNOWLEDGE_TOKEN_SECRET}
  KNOWLEDGE_SESSION_TTL_SECONDS: ${KNOWLEDGE_SESSION_TTL_SECONDS:-1209600}
  KNOWLEDGE_WORKER_CONCURRENCY: ${KNOWLEDGE_WORKER_CONCURRENCY:-2}
  KNOWLEDGE_WORKER_LEASE_SECONDS: ${KNOWLEDGE_WORKER_LEASE_SECONDS:-60}
  KNOWLEDGE_WORKER_HEARTBEAT_SECONDS: ${KNOWLEDGE_WORKER_HEARTBEAT_SECONDS:-10}
  KNOWLEDGE_WORKER_STALE_SECONDS: ${KNOWLEDGE_WORKER_STALE_SECONDS:-45}
  KNOWLEDGE_COS_PROBE_ENABLED: ${KNOWLEDGE_COS_PROBE_ENABLED:-true}
  KNOWLEDGE_COS_PROBE_INTERVAL_SECONDS: ${KNOWLEDGE_COS_PROBE_INTERVAL_SECONDS:-60}
  KNOWLEDGE_COS_PROBE_TIMEOUT_MS: ${KNOWLEDGE_COS_PROBE_TIMEOUT_MS:-5000}
  KNOWLEDGE_EMBEDDING_LEASE_SECONDS: ${KNOWLEDGE_EMBEDDING_LEASE_SECONDS:-120}
  KNOWLEDGE_EMBEDDING_REQUEST_TIMEOUT_MS: ${KNOWLEDGE_EMBEDDING_REQUEST_TIMEOUT_MS:-60000}
  KNOWLEDGE_RETRIEVAL_ENHANCEMENT_TIMEOUT_MS: ${KNOWLEDGE_RETRIEVAL_ENHANCEMENT_TIMEOUT_MS:-15000}

services:
  migrate:
    build:
      context: ../..
      dockerfile: deploy/knowledge/Dockerfile
    environment:
      DATABASE_URL: ${KNOWLEDGE_MIGRATION_DATABASE_URL:?set a separate migration-role URL}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      KNOWLEDGE_ALLOW_INSECURE_DATABASE: ${KNOWLEDGE_ALLOW_INSECURE_DATABASE:-false}
    command: ["npm", "run", "knowledge:migrate"]
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: deploy/knowledge/Dockerfile
    restart: unless-stopped
    environment:
      <<: *knowledge-environment
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - app-metadata:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 8

  knowledge-worker:
    build:
      context: ../..
      dockerfile: deploy/knowledge/Dockerfile
    restart: unless-stopped
    environment: *knowledge-environment
    command: ["npm", "run", "knowledge:worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  app-metadata:
